# Runs the test suites on every pull request, so a change that breaks something shows a red ✗
# on the pull request before anyone merges it. The same lists run locally with
# `node frontend/tests/run.mjs` (see CONTRIBUTING.md).
#
# Safe for pull requests from forks: `pull_request` (never `pull_request_target`) gives the run
# a read-only token and no secrets, and every suite uses made-up links and throwaway databases.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  logic:
    name: Build, logic and backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'   # the version the Windows app ships with
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the backend packages
        run: python -m pip install -r requirements.txt
      - name: Install the app's packages
        working-directory: frontend
        run: npm ci
      - name: Check types and build the app
        working-directory: frontend
        run: npm run build
      - name: Run the logic and backend tests
        env:
          PYTHON: python
        run: node frontend/tests/run.mjs unit python
      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-logic
          path: .verify/test-logs/
          retention-days: 7

  browser:
    name: The app in a browser (part ${{ matrix.part }} of 3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the backend packages
        run: python -m pip install -r requirements.txt
      - name: Install and build the app
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install the test browser
        working-directory: frontend
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run the browser tests
        env:
          PYTHON: python
        # One retry absorbs a slow machine; a suite that only passes on its retry is
        # listed in the run's summary so it can be looked at.
        run: node frontend/tests/run.mjs browser --shard ${{ matrix.part }}/3 --retries 1
      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-part-${{ matrix.part }}
          path: .verify/test-logs/
          retention-days: 7
